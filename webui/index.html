<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirabox N4 · Codex Micro Lab</title><style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui;background:#10131a;color:#e7eaf0}body{margin:0;max-width:1100px;margin:auto;padding:24px}h1{font-size:24px}h2{font-size:16px;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#191e27;border:1px solid #303847;border-radius:12px;padding:16px}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.keys button,.row button{background:#263244;color:#fff;border:1px solid #46536a;border-radius:8px;padding:12px;cursor:pointer}.keys button:hover,.row button:hover{background:#354967}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.log{height:230px;overflow:auto;background:#0b0e13;padding:10px;border-radius:8px;font:12px ui-monospace,monospace;white-space:pre-wrap}.slot{display:flex;align-items:center;gap:8px;margin:5px 0}.dot{width:14px;height:14px;border-radius:50%;background:#333;display:inline-block}.muted{color:#9ba6b8;font-size:13px}input{background:#0e1219;color:#fff;border:1px solid #46536a;border-radius:6px;padding:8px;width:100%}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>Mirabox N4 · Codex Micro Lab</h1><p class="muted">离线测试台：先验证 N4 事件 → Codex Micro 协议，再接 Windows 虚拟 HID。</p><div class="grid"><section class="card"><h2>按键模拟</h2><div class="keys" id="keys"></div><h2>旋钮模拟</h2><div class="row"><button onclick="eventRpc('ENC_CW',2)">旋钮顺时针</button><button onclick="eventRpc('ENC_CC',2)">旋钮逆时针</button><button onclick="eventRpc('ENC',1)">旋钮按下</button><button onclick="eventRpc('ENC',0)">旋钮释放</button></div><h2>原始报告解码</h2><p class="muted">输入十六进制 HID 报告；硬件码在第 10 个字节（data[9]）。</p><input id="raw" placeholder="00 00 00 00 00 00 00 00 00 A1 01"><div class="row"><button onclick="decodeRaw()">解码原始报告</button></div></section><section class="card"><h2>Micro RPC</h2><div class="row"><button onclick="rpc({method:'sys.version',params:{},id:1})">查询版本</button><button onclick="rpc({method:'device.status',params:{},id:2})">查询状态</button><button onclick="lights()">发送灯光状态</button><button onclick="clearLog()">清空日志</button></div><h2>N4 显示的任务灯</h2><div id="slots"></div><h2>事件日志</h2><div class="log" id="log"></div></section></div><script>
const $=id=>document.getElementById(id), log=x=>{$('log').textContent+=new Date().toLocaleTimeString()+'  '+JSON.stringify(x)+'\n';$('log').scrollTop=$('log').scrollHeight};
for(let i=0;i<6;i++){let b=document.createElement('button');b.textContent='Agent '+i;b.onclick=()=>eventRpc('AG0'+i,1);$('keys').append(b)}
for(let i=6;i<13;i++){let b=document.createElement('button');b.textContent='Cmd '+i;b.onclick=()=>eventRpc('ACT'+String(i).padStart(2,'0'),1);$('keys').append(b)}
async function post(url,data){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});return r.json()}
async function rpc(request){let x=await post('/api/rpc',request);log(x);render(x.state);}
function eventRpc(k,act){log({event:{method:'v.oai.hid',params:{k,act}},note:'模拟事件；当前未发送到真实 Codex'})}
async function lights(){await rpc({method:'v.oai.thstatus',params:[{id:0,c:0x3388ff,b:1,e:'breath',s:.4},{id:1,c:0x44dd66,b:1,e:'solid',s:0},{id:2,c:0xffaa00,b:1,e:'solid',s:0}],id:3})}
async function decodeRaw(){let hex=$('raw').value.replace(/[^0-9a-f]/gi,'');log(await post('/api/raw',{hex}))}
async function refresh(){let x=await fetch('/api/state').then(r=>r.json());render(x)}
function render(x){if(!x?.slots)return;$('slots').innerHTML=x.slots.map(s=>`<div class="slot"><span class="dot" style="background:#${s.c.toString(16).padStart(6,'0')}"></span>Agent ${s.id}: ${s.e} / brightness ${s.b}</div>`).join('')}
function clearLog(){$('log').textContent=''} refresh();
</script></body></html>
